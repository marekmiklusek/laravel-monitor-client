<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Laravel Monitor Client – exceptions and heartbeats, reported to your own monitoring service">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="55%" stop-color="#131f3d"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>

        <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
            <stop offset="12%" stop-color="#f43f5e" stop-opacity="0.9"/>
            <stop offset="55%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#fda4af"/>
        </linearGradient>

        <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>

        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
    <rect width="1280" height="360" rx="20" fill="url(#grid)"/>

    <circle cx="1150" cy="60" r="190" fill="#6366f1" fill-opacity="0.10"/>
    <circle cx="150" cy="345" r="140" fill="#f43f5e" fill-opacity="0.07"/>

    <g transform="translate(80, 96)">
        <text x="0" y="0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="19" font-weight="600" letter-spacing="4.5" fill="#818cf8">LARAVEL PACKAGE</text>

        <text x="0" y="72" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="66" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Monitor Client</text>

        <text x="0" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="25" font-weight="400" fill="#94a3b8">Exceptions and heartbeats, reported to your own service.</text>

        <rect x="0" y="148" width="132" height="4" rx="2" fill="url(#rule)"/>

        <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">
            <g transform="translate(0, 206)">
                <rect x="0" y="-19" width="228" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"/>
                <circle cx="20" cy="-2" r="4" fill="#f43f5e"/>
                <text x="36" y="3">never breaks your app</text>
            </g>
            <g transform="translate(248, 206)">
                <rect x="0" y="-19" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"/>
                <circle cx="20" cy="-2" r="4" fill="#22c55e"/>
                <text x="36" y="3">one request/cycle</text>
            </g>
            <g transform="translate(464, 206)">
                <rect x="0" y="-19" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"/>
                <circle cx="20" cy="-2" r="4" fill="#6366f1"/>
                <text x="36" y="3">scrubs secrets</text>
            </g>
        </g>
    </g>

    <g transform="translate(0, 254)" opacity="0.95">
        <path d="M760 40 H872 l14 -34 l20 68 l18 -80 l22 92 l16 -46 h30 l12 -22 l14 22 h122"
              fill="none" stroke="url(#pulse)" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="1156" cy="40" r="6" fill="#fda4af"/>
    </g>
</svg>
